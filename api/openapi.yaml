openapi: 3.0.3
info:
  title: Spillway admin API
  version: 0.4.0
  description: |
    The API behind the dashboard. Its only caller is the dashboard's server-side layer, which signs users in
    with POST /admin/login and forwards the returned token as `Authorization: Bearer <token>`. The browser
    never sees the token. TypeScript types for web/ are generated from this file, and a Go test checks that
    the real responses match it.

    Each operation says which roles may call it with `x-access`: `public`, `viewer` (any signed-in user)
    or `admin`. The Go router registers the same access level, and a test fails if they disagree.
paths:
  /admin/login:
    post:
      operationId: login
      summary: Sign in with a username and password
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: The body was not a username and a password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: The username or password is wrong. The answer is the same for an unknown user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Five failed sign-ins in a minute for this address or username
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds until the next try is allowed }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/me:
    get:
      operationId: me
      summary: The signed-in user and their role
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The user the token belongs to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: No token, a bad token, or an expired one (`session_expired`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/status:
    get:
      operationId: status
      summary: Whether Spillway's dependencies are reachable
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Dependency status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401":
          description: No token, a bad token, or an expired one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/keys:
    get:
      operationId: listKeys
      summary: Every key with its limits and this month's spend. Never the key itself.
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Active keys first, then revoked ones
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createKey
      summary: Create a key. The full key is in the response once and can never be shown again.
      x-access: admin
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateKey
      summary: Change a key's name, limits or cache settings. A field left out is unchanged; null removes a limit.
      x-access: admin
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyUpdate" }
      responses:
        "200":
          description: The key after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The key is revoked and cannot be changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: revokeKey
      summary: Revoke a key. The gateway rejects it from the next request. Revoking twice changes nothing.
      x-access: admin
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The revoked key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/usage/summary:
    get:
      operationId: usageSummary
      summary: Totals, cache outcomes, provider health and a breakdown by day, model or key for a range of UTC days
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/KeyId" }
        - name: group_by
          in: query
          required: false
          schema: { type: string, enum: [day, model, key], default: day }
        - name: stack
          in: query
          required: false
          description: "With group_by=day, what each day is split by"
          schema: { type: string, enum: [model, key], default: model }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/usage/requests:
    get:
      operationId: usageRequests
      summary: The request log, newest first, with the attempts each request made
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/KeyId" }
        - { name: model, in: query, required: false, schema: { type: string } }
        - { name: outcome, in: query, required: false, schema: { type: string } }
        - { name: policy, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/usage/export.csv:
    get:
      operationId: usageExport
      summary: One CSV row per day, key and model, with exact dollar amounts
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/KeyId" }
      responses:
        "200":
          description: A CSV file
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/models:
    get:
      operationId: listModels
      summary: The model catalog and routing policies (read only)
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Models and policies
          content:
            application/json:
              schema:
                type: object
                required: [models, policies]
                properties:
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogModel" }
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/playground:
    get:
      operationId: playgroundState
      summary: The playground's policies, its key's budget and whether fault injection is on
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaygroundState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/playground/chat:
    post:
      operationId: playgroundChat
      summary: Send one prompt through the gateway under the playground key, optionally making providers fail on purpose
      description: |
        Admin only, because it spends money. A prompt no provider could answer is still a 200, with `outcome` and
        `error` set and the failed route in `attempts`. 402 means the playground key's budget is used up and 429
        that its rate limit was hit.
      x-access: admin
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaygroundChatRequest" }
      responses:
        "200":
          description: The route taken and the answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaygroundResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: The playground key's monthly budget is used up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: The playground key's rate limit was hit
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/playground/history:
    get:
      operationId: playgroundHistory
      summary: Past playground requests, newest first
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [requests, next_cursor]
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/PlaygroundHistoryItem" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  parameters:
    From:
      { name: from, in: query, required: false, description: "First UTC day, inclusive (YYYY-MM-DD). Default: 13 days before `to`.", schema: { type: string, format: date } }
    To:
      { name: to, in: query, required: false, description: "Last UTC day, inclusive (YYYY-MM-DD). Default: today.", schema: { type: string, format: date } }
    KeyId:
      { name: key_id, in: query, required: false, description: Only this key, schema: { type: string, format: uuid } }
  responses:
    BadRequest:
      description: The request is not valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No token, a bad token, or an expired one
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The signed-in user is a viewer and this needs an admin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Role:
      type: string
      enum: [admin, viewer]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    User:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    ApiKey:
      type: object
      required: [id, name, prefix, rate_limit_rpm, monthly_budget_usd, spend_usd, semantic_cache, cache_nonzero_temp, created_at, revoked_at, last_used_at, builtin]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "The first characters of the key, for recognising it. Never enough to use it." }
        rate_limit_rpm: { type: integer, nullable: true, description: "Requests a minute; null means no limit" }
        monthly_budget_usd: { type: string, nullable: true, description: "Dollars with six decimals, for example \"30.000000\"; null means no limit" }
        spend_usd: { type: string, description: "This calendar month (UTC), dollars with six decimals" }
        semantic_cache: { type: boolean }
        cache_nonzero_temp: { type: boolean }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        builtin: { type: boolean, description: "The dashboard's own playground key, which cannot be changed here" }
    CreatedKey:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string, description: "The full key. Shown once; only a hash is stored." }
    KeyCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        rate_limit_rpm: { type: integer, minimum: 1, maximum: 1000000, nullable: true }
        monthly_budget_usd:
          description: Dollars, as a string or a number. Null or left out means no limit.
          nullable: true
          oneOf: [{ type: string }, { type: number }]
        semantic_cache: { type: boolean }
        cache_nonzero_temp: { type: boolean }
    KeyUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        rate_limit_rpm: { type: integer, minimum: 1, maximum: 1000000, nullable: true }
        monthly_budget_usd:
          nullable: true
          oneOf: [{ type: string }, { type: number }]
        semantic_cache: { type: boolean }
        cache_nonzero_temp: { type: boolean }
    Attempt:
      type: object
      required: [provider, model, kind, latency_ms]
      properties:
        provider: { type: string }
        model: { type: string }
        kind: { type: string, enum: [primary, retry, fallback, hedge, skipped] }
        latency_ms: { type: integer }
        status: { type: integer }
        error: { type: string }
        error_kind: { type: string }
        injected: { type: boolean }
        estimated: { type: boolean }
    CacheSplit:
      type: object
      required: [miss, hit_exact, hit_semantic, bypass]
      properties:
        miss: { type: integer, format: int64 }
        hit_exact: { type: integer, format: int64 }
        hit_semantic: { type: integer, format: int64 }
        bypass: { type: integer, format: int64, description: "Not cacheable, or the request never reached the cache" }
    UsageTotals:
      type: object
      required: [requests, input_tokens, output_tokens, cost_usd, saved_usd, saved_share, cache_hits, errors, rejected, cache]
      properties:
        requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: string, description: "Dollars with six decimals" }
        saved_usd: { type: string, description: "What cache hits avoided spending" }
        saved_share: { type: number, minimum: 0, maximum: 1, description: "saved / (spent + saved)" }
        cache_hits: { type: integer, format: int64 }
        errors: { type: integer, format: int64, description: "Requests every provider failed" }
        rejected: { type: integer, format: int64, description: "Refused by a rate limit or a budget" }
        cache: { $ref: "#/components/schemas/CacheSplit" }
    UsageGroup:
      type: object
      required: [key, label, requests, input_tokens, output_tokens, cost_usd, saved_usd, cache_hits, errors, timed_requests, p50_ms, p95_ms]
      properties:
        key: { type: string, description: "The day, the model id, or the key id" }
        label: { type: string }
        requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: string }
        saved_usd: { type: string }
        cache_hits: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        timed_requests: { type: integer, format: int64, description: "Successful requests not served from a cache, which the latency figures use" }
        p50_ms: { type: number, nullable: true, description: "Model groups only" }
        p95_ms: { type: number, nullable: true, description: "Model groups only" }
        series:
          type: object
          description: "Day groups only: that day split by model or by key (see `stack`), keyed by model id or key id"
          additionalProperties: { $ref: "#/components/schemas/SeriesStat" }
    SeriesStat:
      type: object
      required: [label, requests, input_tokens, output_tokens, cost_usd, saved_usd]
      properties:
        label: { type: string, description: "The model id, or the key's name" }
        requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: string }
        saved_usd: { type: string }
    ProviderHealth:
      type: object
      required: [name, state, open_remaining_seconds, failed_attempts, fallbacks_to]
      properties:
        name: { type: string }
        state: { type: string, enum: [closed, open, half_open, not_configured] }
        open_remaining_seconds: { type: integer, nullable: true }
        reason: { type: string }
        failed_attempts: { type: integer, format: int64 }
        fallbacks_to: { type: integer, format: int64 }
    AddedLatency:
      type: object
      required: [p50_ms, p95_ms, p99_ms, samples, since]
      description: "Time spent in Spillway itself, not the upstream call. Covers requests since the service started, for all keys."
      properties:
        p50_ms: { type: number }
        p95_ms: { type: number }
        p99_ms: { type: number }
        samples: { type: integer, format: int64 }
        since: { type: string, format: date-time }
    UsageSummary:
      type: object
      required: [range, group_by, stack, totals, added_latency, providers, fallbacks_fired, groups]
      properties:
        range:
          type: object
          required: [from, to, days]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            days: { type: integer }
        group_by: { type: string, enum: [day, model, key] }
        stack: { type: string, enum: [model, key] }
        totals: { $ref: "#/components/schemas/UsageTotals" }
        added_latency: { allOf: [{ $ref: "#/components/schemas/AddedLatency" }], nullable: true }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderHealth" }
        fallbacks_fired: { type: integer, format: int64 }
        groups:
          type: array
          items: { $ref: "#/components/schemas/UsageGroup" }
    RequestLogRow:
      type: object
      required: [id, key_id, key_name, policy, provider, model, input_tokens, output_tokens, cost_usd, saved_usd, latency_ms, ttfb_ms, cache_status, outcome, attempts, created_at]
      properties:
        id: { type: string, format: uuid }
        key_id: { type: string, format: uuid, nullable: true }
        key_name: { type: string }
        policy: { type: string }
        provider: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: string }
        saved_usd: { type: string }
        latency_ms: { type: integer }
        ttfb_ms: { type: integer, nullable: true }
        cache_status: { type: string, enum: [miss, hit_exact, hit_semantic, bypass] }
        outcome: { type: string }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/Attempt" }
        created_at: { type: string, format: date-time }
    RequestPage:
      type: object
      required: [requests, next_cursor]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/RequestLogRow" }
        next_cursor: { type: string, nullable: true }
    Fault:
      type: object
      required: [provider, kind]
      additionalProperties: false
      properties:
        provider: { type: string, description: A provider name from the catalog }
        kind: { type: string, enum: [rate_limit, server_error, slow, cut_stream] }
    CatalogModel:
      type: object
      required: [id, provider, upstream, tags, context_window, input_usd_per_mtok, output_usd_per_mtok]
      properties:
        id: { type: string }
        provider: { type: string }
        upstream: { type: string }
        tags: { type: array, items: { type: string } }
        context_window: { type: integer }
        input_usd_per_mtok: { type: string }
        output_usd_per_mtok: { type: string }
    CatalogPolicy:
      type: object
      required: [name, type, description, models, providers, weights, tag, hedge_after_ms]
      properties:
        name: { type: string }
        type: { type: string, enum: [fixed, fallback, cheapest, weighted] }
        description: { type: string }
        models:
          type: array
          description: In the order they are tried (for weighted, the arms)
          items:
            type: object
            required: [id, provider]
            properties:
              id: { type: string }
              provider: { type: string }
        providers: { type: array, items: { type: string }, description: "Distinct providers in the order they would be tried" }
        weights: { type: array, items: { type: integer } }
        tag: { type: string }
        hedge_after_ms: { type: integer }
    PlaygroundState:
      type: object
      required: [key, fault_injection, policies]
      properties:
        key:
          type: object
          required: [prefix, monthly_budget_usd, spend_usd, rate_limit_rpm]
          properties:
            prefix: { type: string }
            monthly_budget_usd: { type: string, nullable: true }
            spend_usd: { type: string }
            rate_limit_rpm: { type: integer, nullable: true }
        fault_injection: { type: boolean }
        policies:
          type: array
          items: { $ref: "#/components/schemas/CatalogPolicy" }
    PlaygroundChatRequest:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        policy: { type: string, description: "A policy name or a model id. Default: default" }
        prompt: { type: string, minLength: 1, maxLength: 8000 }
        system: { type: string, maxLength: 4000 }
        temperature: { type: number, minimum: 0, maximum: 2, nullable: true }
        max_tokens: { type: integer, minimum: 1, maximum: 4096, nullable: true }
        stream: { type: boolean, description: "Needed for the cut_stream fault" }
        faults:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/Fault" }
    PlaygroundResult:
      type: object
      required: [id, created_at, policy, stream, answer, finish_reason, provider, model, cache, input_tokens, output_tokens, cost_usd, saved_usd, latency_ms, overhead_ms, outcome, error, attempts, faults, unused_faults]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        policy: { type: string }
        stream: { type: boolean }
        answer: { type: string }
        finish_reason: { type: string }
        provider: { type: string }
        model: { type: string }
        cache: { type: string, enum: [miss, hit_exact, hit_semantic, bypass] }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: string }
        saved_usd: { type: string }
        latency_ms: { type: integer }
        overhead_ms: { type: integer, description: "Time spent in Spillway rather than at a provider" }
        outcome: { type: string }
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
        faults: { type: array, items: { $ref: "#/components/schemas/Fault" } }
        unused_faults: { type: array, items: { $ref: "#/components/schemas/Fault" }, description: "Faults that named a provider the policy would not try" }
    PlaygroundHistoryItem:
      allOf:
        - $ref: "#/components/schemas/PlaygroundResult"
        - type: object
          required: [prompt, system]
          properties:
            prompt: { type: string }
            system: { type: string }
    Status:
      type: object
      required: [postgres, redis]
      properties:
        postgres: { type: string, enum: [up, down, unknown] }
        redis: { type: string, enum: [up, down, disabled], description: "disabled means REDIS_URL is not set" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
