openapi: 3.0.3
info:
  title: Spillway admin API
  version: 0.4.0
  description: |
    The API behind the dashboard. Its only caller is the dashboard's server-side layer, which signs users in
    with POST /admin/login and forwards the returned token as `Authorization: Bearer <token>`. The browser
    never sees the token. TypeScript types for web/ are generated from this file, and a Go test checks that
    the real responses match it.

    Each operation says which roles may call it with `x-access`: `public`, `viewer` (any signed-in user)
    or `admin`. The Go router registers the same access level, and a test fails if they disagree.
paths:
  /admin/login:
    post:
      operationId: login
      summary: Sign in with a username and password
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: The body was not a username and a password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: The username or password is wrong. The answer is the same for an unknown user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Five failed sign-ins in a minute for this address or username
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds until the next try is allowed }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/me:
    get:
      operationId: me
      summary: The signed-in user and their role
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The user the token belongs to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: No token, a bad token, or an expired one (`session_expired`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/status:
    get:
      operationId: status
      summary: Whether Spillway's dependencies are reachable
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Dependency status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401":
          description: No token, a bad token, or an expired one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/keys:
    get:
      operationId: listKeys
      summary: Every key with its limits and this month's spend. Never the key itself.
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Active keys first, then revoked ones
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createKey
      summary: Create a key. The full key is in the response once and can never be shown again.
      x-access: admin
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateKey
      summary: Change a key's name, limits or cache settings. A field left out is unchanged; null removes a limit.
      x-access: admin
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyUpdate" }
      responses:
        "200":
          description: The key after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The key is revoked and cannot be changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: revokeKey
      summary: Revoke a key. The gateway rejects it from the next request. Revoking twice changes nothing.
      x-access: admin
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The revoked key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/usage/summary:
    get:
      operationId: usageSummary
      summary: Totals, cache outcomes, provider health and a breakdown by day, model or key for a range of UTC days
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/KeyId" }
        - name: group_by
          in: query
          required: false
          schema: { type: string, enum: [day, model, key], default: day }
        - name: stack
          in: query
          required: false
          description: "With group_by=day, what each day is split by"
          schema: { type: string, enum: [model, key], default: model }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/usage/requests:
    get:
      operationId: usageRequests
      summary: The request log, newest first, with the attempts each request made
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/KeyId" }
        - { name: model, in: query, required: false, schema: { type: string } }
        - { name: outcome, in: query, required: false, schema: { type: string } }
        - { name: policy, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/usage/export.csv:
    get:
      operationId: usageExport
      summary: One CSV row per day, key and model, with exact dollar amounts
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/KeyId" }
      responses:
        "200":
          description: A CSV file
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/models:
    get:
      operationId: listModels
      summary: The model catalog and routing policies (read only)
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Models and policies
          content:
            application/json:
              schema:
                type: object
                required: [models, policies]
                properties:
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogModel" }
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/playground:
    get:
      operationId: playgroundState
      summary: The playground's policies, its key's budget and whether fault injection is on
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaygroundState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/playground/chat:
    post:
      operationId: playgroundChat
      summary: Send one prompt through the gateway under the playground key, optionally making providers fail on purpose
      description: |
        Admin only, because it spends money. A prompt no provider could answer is still a 200, with `outcome` and
        `error` set and the failed route in `attempts`. 402 means the playground key's budget is used up and 429
        that its rate limit was hit.
      x-access: admin
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaygroundChatRequest" }
      responses:
        "200":
          description: The route taken and the answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaygroundResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: The playground key's monthly budget is used up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: The playground key's rate limit was hit
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/playground/history:
    get:
      operationId: playgroundHistory
      summary: Past playground requests, newest first
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [requests, next_cursor]
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/PlaygroundHistoryItem" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/runs/summary:
    get:
      operationId: runsSummary
      summary: Counts by status, and the runs waiting for a person
      description: Running, Sleeping and Needs you are the runs in those states now; Succeeded, Failed and Cancelled are runs that ended inside the range.
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { name: hours, in: query, required: false, schema: { type: integer, enum: [1, 24, 168], default: 24 } }
      responses:
        "200":
          description: Counts and the waiting list
          content:
            application/json:
              schema:
                type: object
                required: [hours, counts, waiting]
                properties:
                  hours: { type: integer }
                  counts: { $ref: "#/components/schemas/RunCounts" }
                  waiting:
                    type: array
                    items: { $ref: "#/components/schemas/WaitingRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/runs/activity:
    get:
      operationId: runsActivity
      summary: Runs started per slice of time, by where they stand now
      description: One slice per 5 minutes for an hour, per hour for a day, per day for a week. Slices with no runs are included.
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { name: hours, in: query, required: false, schema: { type: integer, enum: [1, 24, 168], default: 24 } }
      responses:
        "200":
          description: Buckets, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [hours, bucket_seconds, buckets]
                properties:
                  hours: { type: integer }
                  bucket_seconds: { type: integer }
                  buckets:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityBucket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/runs:
    get:
      operationId: runsList
      summary: Runs, newest first, each with a strip of its latest steps
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { name: state, in: query, required: false, description: "active is every run not finished; finished is runs that ended inside `hours`", schema: { type: string, enum: [active, finished] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [queued, running, waiting_tool, waiting_human, sleeping, succeeded, failed, cancelled] } }
        - { name: hours, in: query, required: false, schema: { type: integer, enum: [1, 24, 168], default: 24 } }
        - { name: q, in: query, required: false, description: Only runs whose task contains this text (ignoring case), schema: { type: string, maxLength: 100 } }
        - { name: key_id, in: query, required: false, description: Only runs of this API key, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_cursor]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/RunItem" }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: runsCreate
      summary: Start a run from the dashboard
      description: The run is made under the built-in playground key and charged to it. Tools are not available from the dashboard yet.
      x-access: admin
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunStart" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/runs/{id}:
    get:
      operationId: runGet
      summary: One run, in the shape of a list row
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/runs/{id}/graph:
    get:
      operationId: runGraph
      summary: The run as a graph of attempts, with workers and recoveries
      description: One node per attempt at a step, so a step re-issued after a worker was lost appears once per attempt.
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunGraph" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/runs/{id}/events:
    get:
      operationId: runEvents
      summary: The run's step rows as server-sent events
      description: Replays rows after Last-Event-ID (or ?after=), then streams live ones, and ends after the final run.status event.
      x-access: viewer
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/runs/{id}/cancel:
    post:
      operationId: runCancel
      summary: Cancel a run
      description: A run nobody is working on is cancelled at once; a run a worker holds is cancelled within a heartbeat.
      x-access: admin
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Cancelled, or asked to cancel
          content:
            application/json:
              schema:
                type: object
                required: [id, status, cancel_requested]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  cancel_requested: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The run already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/runs/{id}/approve:
    post:
      operationId: runApprove
      summary: Approve a run that waits for a person
      description: Resolves the run's pending wait_human step. The run is claimable at once, by any worker, including one that starts after the worker that parked it has gone.
      x-access: admin
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Decision" }
      responses:
        "202": { $ref: "#/components/responses/Decided" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The run is not waiting for a decision, or already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/runs/{id}/reject:
    post:
      operationId: runReject
      summary: Reject a run that waits for a person
      description: Ends the run as failed with reason "rejected". The note is kept on the step.
      x-access: admin
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Decision" }
      responses:
        "202": { $ref: "#/components/responses/Decided" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The run is not waiting for a decision, or already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/tools:
    get:
      operationId: toolsList
      summary: The tool registry
      description: HTTP tools and MCP servers. Auth header values are never returned, only their names.
      x-access: viewer
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Registered tools
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools: { type: array, items: { $ref: "#/components/schemas/Tool" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: toolCreate
      summary: Register a tool or an MCP server
      x-access: admin
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolInput" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tool" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A tool with that name exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/tools/{id}:
    put:
      operationId: toolUpdate
      summary: Change a tool
      description: Fields left out are kept. Headers, when sent, replace the stored ones.
      x-access: admin
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tool" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: toolDelete
      summary: Remove a tool
      x-access: admin
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/tools/{id}/discover:
    post:
      operationId: toolDiscover
      summary: Fetch an MCP server's tools
      description: Calls tools/list on the server and stores the answer. Its tools are then usable in a run as `server.tool`.
      x-access: admin
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The server with its discovered tools
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tool" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The MCP server could not be reached or answered badly
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  parameters:
    From:
      { name: from, in: query, required: false, description: "First UTC day, inclusive (YYYY-MM-DD). Default: 13 days before `to`.", schema: { type: string, format: date } }
    To:
      { name: to, in: query, required: false, description: "Last UTC day, inclusive (YYYY-MM-DD). Default: today.", schema: { type: string, format: date } }
    KeyId:
      { name: key_id, in: query, required: false, description: Only this key, schema: { type: string, format: uuid } }
  responses:
    Decided:
      description: The decision was recorded
      content:
        application/json:
          schema:
            type: object
            required: [id, status]
            properties:
              id: { type: string, format: uuid }
              status: { type: string }
    BadRequest:
      description: The request is not valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No token, a bad token, or an expired one
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The signed-in user is a viewer and this needs an admin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Role:
      type: string
      enum: [admin, viewer]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    User:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    ApiKey:
      type: object
      required: [id, name, prefix, rate_limit_rpm, monthly_budget_usd, spend_usd, semantic_cache, cache_nonzero_temp, created_at, revoked_at, last_used_at, builtin]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "The first characters of the key, for recognising it. Never enough to use it." }
        rate_limit_rpm: { type: integer, nullable: true, description: "Requests a minute; null means no limit" }
        monthly_budget_usd: { type: string, nullable: true, description: "Dollars with six decimals, for example \"30.000000\"; null means no limit" }
        spend_usd: { type: string, description: "This calendar month (UTC), dollars with six decimals" }
        semantic_cache: { type: boolean }
        cache_nonzero_temp: { type: boolean }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        builtin: { type: boolean, description: "The dashboard's own playground key, which cannot be changed here" }
    CreatedKey:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string, description: "The full key. Shown once; only a hash is stored." }
    KeyCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        rate_limit_rpm: { type: integer, minimum: 1, maximum: 1000000, nullable: true }
        monthly_budget_usd:
          description: Dollars, as a string or a number. Null or left out means no limit.
          nullable: true
          oneOf: [{ type: string }, { type: number }]
        semantic_cache: { type: boolean }
        cache_nonzero_temp: { type: boolean }
    KeyUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        rate_limit_rpm: { type: integer, minimum: 1, maximum: 1000000, nullable: true }
        monthly_budget_usd:
          nullable: true
          oneOf: [{ type: string }, { type: number }]
        semantic_cache: { type: boolean }
        cache_nonzero_temp: { type: boolean }
    Attempt:
      type: object
      required: [provider, model, kind, latency_ms]
      properties:
        provider: { type: string }
        model: { type: string }
        kind: { type: string, enum: [primary, retry, fallback, hedge, skipped] }
        latency_ms: { type: integer }
        status: { type: integer }
        error: { type: string }
        error_kind: { type: string }
        injected: { type: boolean }
        estimated: { type: boolean }
    CacheSplit:
      type: object
      required: [miss, hit_exact, hit_semantic, bypass]
      properties:
        miss: { type: integer, format: int64 }
        hit_exact: { type: integer, format: int64 }
        hit_semantic: { type: integer, format: int64 }
        bypass: { type: integer, format: int64, description: "Not cacheable, or the request never reached the cache" }
    UsageTotals:
      type: object
      required: [requests, input_tokens, output_tokens, cost_usd, saved_usd, saved_share, cache_hits, errors, rejected, cache]
      properties:
        requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: string, description: "Dollars with six decimals" }
        saved_usd: { type: string, description: "What cache hits avoided spending" }
        saved_share: { type: number, minimum: 0, maximum: 1, description: "saved / (spent + saved)" }
        cache_hits: { type: integer, format: int64 }
        errors: { type: integer, format: int64, description: "Requests every provider failed" }
        rejected: { type: integer, format: int64, description: "Refused by a rate limit or a budget" }
        cache: { $ref: "#/components/schemas/CacheSplit" }
    UsageGroup:
      type: object
      required: [key, label, requests, input_tokens, output_tokens, cost_usd, saved_usd, cache_hits, errors, timed_requests, p50_ms, p95_ms]
      properties:
        key: { type: string, description: "The day, the model id, or the key id" }
        label: { type: string }
        requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: string }
        saved_usd: { type: string }
        cache_hits: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        timed_requests: { type: integer, format: int64, description: "Successful requests not served from a cache, which the latency figures use" }
        p50_ms: { type: number, nullable: true, description: "Model groups only" }
        p95_ms: { type: number, nullable: true, description: "Model groups only" }
        series:
          type: object
          description: "Day groups only: that day split by model or by key (see `stack`), keyed by model id or key id"
          additionalProperties: { $ref: "#/components/schemas/SeriesStat" }
    SeriesStat:
      type: object
      required: [label, requests, input_tokens, output_tokens, cost_usd, saved_usd]
      properties:
        label: { type: string, description: "The model id, or the key's name" }
        requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: string }
        saved_usd: { type: string }
    ProviderHealth:
      type: object
      required: [name, state, open_remaining_seconds, failed_attempts, fallbacks_to]
      properties:
        name: { type: string }
        state: { type: string, enum: [closed, open, half_open, not_configured] }
        open_remaining_seconds: { type: integer, nullable: true }
        reason: { type: string }
        failed_attempts: { type: integer, format: int64 }
        fallbacks_to: { type: integer, format: int64 }
    AddedLatency:
      type: object
      required: [p50_ms, p95_ms, p99_ms, samples, since]
      description: "Time spent in Spillway itself, not the upstream call. Covers requests since the service started, for all keys."
      properties:
        p50_ms: { type: number }
        p95_ms: { type: number }
        p99_ms: { type: number }
        samples: { type: integer, format: int64 }
        since: { type: string, format: date-time }
    UsageSummary:
      type: object
      required: [range, group_by, stack, totals, added_latency, providers, fallbacks_fired, groups]
      properties:
        range:
          type: object
          required: [from, to, days]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            days: { type: integer }
        group_by: { type: string, enum: [day, model, key] }
        stack: { type: string, enum: [model, key] }
        totals: { $ref: "#/components/schemas/UsageTotals" }
        added_latency: { allOf: [{ $ref: "#/components/schemas/AddedLatency" }], nullable: true }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderHealth" }
        fallbacks_fired: { type: integer, format: int64 }
        groups:
          type: array
          items: { $ref: "#/components/schemas/UsageGroup" }
    RequestLogRow:
      type: object
      required: [id, key_id, key_name, policy, provider, model, input_tokens, output_tokens, cost_usd, saved_usd, latency_ms, ttfb_ms, cache_status, outcome, attempts, created_at]
      properties:
        id: { type: string, format: uuid }
        key_id: { type: string, format: uuid, nullable: true }
        key_name: { type: string }
        policy: { type: string }
        provider: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: string }
        saved_usd: { type: string }
        latency_ms: { type: integer }
        ttfb_ms: { type: integer, nullable: true }
        cache_status: { type: string, enum: [miss, hit_exact, hit_semantic, bypass] }
        outcome: { type: string }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/Attempt" }
        created_at: { type: string, format: date-time }
    RequestPage:
      type: object
      required: [requests, next_cursor]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/RequestLogRow" }
        next_cursor: { type: string, nullable: true }
    Fault:
      type: object
      required: [provider, kind]
      additionalProperties: false
      properties:
        provider: { type: string, description: A provider name from the catalog }
        kind: { type: string, enum: [rate_limit, server_error, slow, cut_stream] }
    CatalogModel:
      type: object
      required: [id, provider, upstream, tags, context_window, input_usd_per_mtok, output_usd_per_mtok]
      properties:
        id: { type: string }
        provider: { type: string }
        upstream: { type: string }
        tags: { type: array, items: { type: string } }
        context_window: { type: integer }
        input_usd_per_mtok: { type: string }
        output_usd_per_mtok: { type: string }
    CatalogPolicy:
      type: object
      required: [name, type, description, models, providers, weights, tag, hedge_after_ms]
      properties:
        name: { type: string }
        type: { type: string, enum: [fixed, fallback, cheapest, weighted] }
        description: { type: string }
        models:
          type: array
          description: In the order they are tried (for weighted, the arms)
          items:
            type: object
            required: [id, provider]
            properties:
              id: { type: string }
              provider: { type: string }
        providers: { type: array, items: { type: string }, description: "Distinct providers in the order they would be tried" }
        weights: { type: array, items: { type: integer } }
        tag: { type: string }
        hedge_after_ms: { type: integer }
    PlaygroundState:
      type: object
      required: [key, fault_injection, policies]
      properties:
        key:
          type: object
          required: [prefix, monthly_budget_usd, spend_usd, rate_limit_rpm]
          properties:
            prefix: { type: string }
            monthly_budget_usd: { type: string, nullable: true }
            spend_usd: { type: string }
            rate_limit_rpm: { type: integer, nullable: true }
        fault_injection: { type: boolean }
        policies:
          type: array
          items: { $ref: "#/components/schemas/CatalogPolicy" }
    PlaygroundChatRequest:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        policy: { type: string, description: "A policy name or a model id. Default: default" }
        prompt: { type: string, minLength: 1, maxLength: 8000 }
        system: { type: string, maxLength: 4000 }
        temperature: { type: number, minimum: 0, maximum: 2, nullable: true }
        max_tokens: { type: integer, minimum: 1, maximum: 4096, nullable: true }
        stream: { type: boolean, description: "Needed for the cut_stream fault" }
        faults:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/Fault" }
    PlaygroundResult:
      type: object
      required: [id, created_at, policy, stream, answer, finish_reason, provider, model, cache, input_tokens, output_tokens, cost_usd, saved_usd, latency_ms, overhead_ms, outcome, error, attempts, faults, unused_faults]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        policy: { type: string }
        stream: { type: boolean }
        answer: { type: string }
        finish_reason: { type: string }
        provider: { type: string }
        model: { type: string }
        cache: { type: string, enum: [miss, hit_exact, hit_semantic, bypass] }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: string }
        saved_usd: { type: string }
        latency_ms: { type: integer }
        overhead_ms: { type: integer, description: "Time spent in Spillway rather than at a provider" }
        outcome: { type: string }
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
        faults: { type: array, items: { $ref: "#/components/schemas/Fault" } }
        unused_faults: { type: array, items: { $ref: "#/components/schemas/Fault" }, description: "Faults that named a provider the policy would not try" }
    PlaygroundHistoryItem:
      allOf:
        - $ref: "#/components/schemas/PlaygroundResult"
        - type: object
          required: [prompt, system]
          properties:
            prompt: { type: string }
            system: { type: string }
    Status:
      type: object
      required: [postgres, redis]
      properties:
        postgres: { type: string, enum: [up, down, unknown] }
        redis: { type: string, enum: [up, down, disabled], description: "disabled means REDIS_URL is not set" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    RunCounts:
      type: object
      required: [running, sleeping, needs_you, succeeded, failed, cancelled]
      properties:
        running: { type: integer }
        sleeping: { type: integer }
        needs_you: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
    WaitingRun:
      type: object
      required: [id, goal, tool, waiting_since, key]
      properties:
        id: { type: string, format: uuid }
        goal: { type: string }
        tool: { type: string }
        waiting_since: { type: string, format: date-time }
        key: { type: string, description: The name of the API key that started the run }
    ActivityBucket:
      type: object
      required: [start, succeeded, failed, cancelled, in_progress]
      properties:
        start: { type: string, format: date-time }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        in_progress: { type: integer }
    StripNode:
      type: object
      required: [kind, state]
      properties:
        kind: { type: string, enum: [model, tool] }
        state: { type: string, enum: [done, current, failed, waiting] }
    Strip:
      type: object
      required: [steps, more]
      properties:
        steps: { type: array, items: { $ref: "#/components/schemas/StripNode" }, description: "At most 16: the latest ones" }
        more: { type: integer, description: How many earlier steps are not shown }
    RunItem:
      type: object
      required: [id, status, goal, key, model, step_count, cost_usd, created_at, finished_at, duration_ms, wake_at, failure_reason, strip]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, waiting_tool, waiting_human, sleeping, succeeded, failed, cancelled] }
        goal: { type: string }
        key: { type: string }
        model: { type: string }
        step_count: { type: integer }
        cost_usd: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer, format: int64 }
        wake_at: { type: string, format: date-time, nullable: true }
        failure_reason: { type: string, nullable: true }
        strip: { $ref: "#/components/schemas/Strip" }
    RunStart:
      type: object
      required: [input]
      additionalProperties: false
      properties:
        input: { type: string }
        system: { type: string }
        model: { type: string, description: A policy name or model id; default is the default policy }
        limits:
          type: object
          additionalProperties: false
          properties:
            max_steps: { type: integer, minimum: 1 }
            max_cost_usd: { type: number }
            deadline_seconds: { type: integer, minimum: 1 }
        metadata: { type: object }
    GraphAttempt:
      type: object
      required: [provider, model, kind, latency_ms]
      properties:
        provider: { type: string }
        model: { type: string }
        kind: { type: string }
        latency_ms: { type: integer }
        status: { type: integer }
        error: { type: string }
        error_kind: { type: string }
        injected: { type: boolean }
        estimated: { type: boolean }
    Decision:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 2000 }
    Tool:
      type: object
      required: [id, name, kind, endpoint, description, header_names, timeout_ms, requires_approval, discovered_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [http, mcp] }
        endpoint: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true, description: "http tools: the JSON Schema of the arguments" }
        mcp_tools:
          type: array
          description: "mcp servers: what the last discover found. Names are `server.tool`."
          items:
            type: object
            required: [name, description]
            properties:
              name: { type: string }
              description: { type: string }
              input_schema: { type: object, additionalProperties: true }
        header_names: { type: array, items: { type: string } }
        timeout_ms: { type: integer, format: int64 }
        requires_approval: { type: boolean }
        discovered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ToolInput:
      type: object
      additionalProperties: false
      required: [name, endpoint]
      properties:
        name: { type: string }
        kind: { type: string, enum: [http, mcp], default: http }
        endpoint: { type: string }
        description: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        input_schema: { type: object, additionalProperties: true }
        timeout_ms: { type: integer, format: int64 }
        requires_approval: { type: boolean }
    ToolUpdate:
      type: object
      additionalProperties: false
      properties:
        endpoint: { type: string }
        description: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        input_schema: { type: object, additionalProperties: true }
        timeout_ms: { type: integer, format: int64 }
        requires_approval: { type: boolean }
    GraphNode:
      type: object
      required: [step_no, type, state, worker, epoch, reissued, started_at, duration_ms, cost_usd, attempts]
      properties:
        step_no: { type: integer }
        type: { type: string, enum: [model_call, tool_call, wait_human, sleep, compaction] }
        state: { type: string, enum: [finished, failed, running, stopped, waiting, sleeping] }
        worker: { type: string }
        epoch: { type: integer, format: int64 }
        reissued: { type: boolean }
        previous_worker: { type: string }
        previous_epoch: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64, nullable: true, description: Null for an attempt that stopped }
        cost_usd: { type: string }
        tool: { type: string }
        model: { type: string }
        provider: { type: string }
        cache: { type: string }
        tokens:
          type: object
          required: [in, out]
          properties: { in: { type: integer }, out: { type: integer } }
        idempotency_key: { type: string }
        attempts: { type: array, items: { $ref: "#/components/schemas/GraphAttempt" } }
        arguments: { type: string }
        result: { type: string }
        message: { type: string }
        error: { type: string }
        reason: { type: string, description: "wait_human: why the run waits" }
        gate: { type: boolean, description: "wait_human: true when a tool is held for approval, false when the model asked" }
        decision: { type: string, enum: [approve, reject] }
        by: { type: string }
        note: { type: string }
        seconds: { type: integer, description: "sleep: how long" }
        wake_at: { type: string, format: date-time, description: "sleep: when it ends" }
    RunGraph:
      type: object
      required: [run, workers, nodes, recoveries, last_event_id]
      properties:
        run:
          type: object
          required: [id, status, goal, key, model, tools, step_count, cost_usd, max_steps, max_cost_usd, deadline_seconds, created_at, finished_at, deadline_at, failure_reason, cancel_requested, lease_owner, lease_epoch, lease_expires_at, wake_at, approval]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [queued, running, waiting_tool, waiting_human, sleeping, succeeded, failed, cancelled] }
            goal: { type: string }
            key: { type: string }
            model: { type: string }
            tools: { type: array, items: { type: string } }
            step_count: { type: integer }
            cost_usd: { type: string }
            max_steps: { type: integer }
            max_cost_usd: { type: string }
            deadline_seconds: { type: integer }
            created_at: { type: string, format: date-time }
            finished_at: { type: string, format: date-time, nullable: true }
            deadline_at: { type: string, format: date-time }
            failure_reason: { type: string, nullable: true }
            cancel_requested: { type: boolean }
            lease_owner: { type: string, nullable: true }
            lease_epoch: { type: integer, format: int64 }
            lease_expires_at: { type: string, format: date-time, nullable: true }
            wake_at: { type: string, format: date-time, nullable: true, description: Set while the run sleeps }
            approval:
              nullable: true
              description: Set while the run waits for a person
              type: object
              required: [step_no, reason, gate, since]
              properties:
                step_no: { type: integer }
                reason: { type: string }
                tool: { type: string }
                arguments: { type: string }
                gate: { type: boolean }
                since: { type: string, format: date-time }
        workers:
          type: array
          items:
            type: object
            required: [id, epochs]
            properties:
              id: { type: string }
              epochs: { type: array, items: { type: integer, format: int64 } }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        recoveries:
          type: array
          items:
            type: object
            required: [after_step, from_worker, to_worker, epoch, at]
            properties:
              after_step: { type: integer }
              from_worker: { type: string }
              to_worker: { type: string }
              epoch: { type: integer, format: int64 }
              at: { type: string, format: date-time }
        last_event_id: { type: integer, format: int64, description: The id of the newest step row; events after it are new }
