version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/db/sqlcgen
        sql_package: pgx/v5
        overrides:
          - { db_type: uuid, go_type: github.com/google/uuid.UUID }
          - { db_type: uuid, nullable: true, go_type: github.com/google/uuid.NullUUID }
          - { db_type: vector, go_type: string } # semantic_cache is queried with hand-written SQL
          - { db_type: timestamptz, go_type: time.Time }
          - { db_type: timestamptz, nullable: true, go_type: { import: time, type: Time, pointer: true } }
